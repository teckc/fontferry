  <text x="256" y="370" text-anchor="middle" font-family="Noto Serif SC, Songti SC, STSong, SimSun, serif" font-size="340" font-weight="900" fill="#111111" stroke="#111111" stroke-width="8" paint-order="stroke" clip-path="url(#right)">字</text>
