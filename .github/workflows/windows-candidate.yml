name: Windows candidate acceptance

on:
  workflow_dispatch:
    inputs:
      bundle_run:
        description: GitHub Actions run ID containing the signed Windows bundle
        required: true
        type: string
      upgrade_with_owned_font:
        description: Verify upgrade from alpha.7 while a real managed font is installed
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  product:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-x64
          path: windows-bundle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.bundle_run }}
      - name: Exercise the installed app as a standard Windows user
        shell: pwsh
        env:
          VERIFY_UPGRADE: ${{ inputs.upgrade_with_owned_font }}
        run: |
          $version = (Get-Content apps/fontferry/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          ./scripts/windows-product-acceptance.ps1 -BundlePath windows-bundle -Version $version -VerifyUpgrade:($env:VERIFY_UPGRADE -eq 'true')
