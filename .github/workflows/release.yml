name: Release

on:
  push:
    tags: ["v0.2.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Bundle (${{ matrix.platform }})
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            bundles: nsis
            target: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-15
            bundles: dmg,app
            target: universal-apple-darwin
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Verify updater signing key
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY in the release environment"
            exit 1
          }
      - name: Build signed updater artifacts and bundles
        shell: bash
        run: pnpm tauri build --config apps/fontferry/src-tauri/tauri.conf.json --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/${{ matrix.target }}/release/bundle/**/*
      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate workspace SBOM
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Download bundles and SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
      - name: Generate SHA-256 checksums
        run: |
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS
      - name: Generate Tauri updater manifest
        run: |
          tag="${GITHUB_REF_NAME}"
          platforms='{}'
          while IFS= read -r signature_file; do
            artifact="${signature_file%.sig}"
            test -f "$artifact" || continue
            name="$(basename "$artifact")"
            case "$name" in
              *nsis.zip) platform="windows-x86_64" ;;
              *app.tar.gz) platform="darwin-universal" ;;
              *AppImage*) platform="linux-x86_64" ;;
              *) continue ;;
            esac
            signature="$(tr -d '\r\n' < "$signature_file")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}"
            platforms="$(jq --arg platform "$platform" --arg signature "$signature" --arg url "$url" \
              '. + {($platform): {signature: $signature, url: $url}}' <<<"$platforms")"
          done < <(find release-artifacts -type f -name '*.sig' | sort)
          test "$(jq 'length' <<<"$platforms")" -eq 3
          jq -n \
            --arg version "${tag#v}" \
            --arg notes "See the GitHub release notes for ${tag}." \
            --arg pub_date "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > release-artifacts/latest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" --verify-tag --generate-notes "${prerelease[@]}"
          while IFS= read -r artifact; do
            gh release upload "$tag" "$artifact"
          done < <(find release-artifacts -type f | sort)
          if [[ "$tag" == *-alpha* || "$tag" == *-beta* ]]; then
            gh release view beta >/dev/null 2>&1 || \
              gh release create beta --target "$GITHUB_SHA" --prerelease --title "FontFerry beta channel"
            while IFS= read -r artifact; do
              gh release upload beta "$artifact" --clobber
            done < <(find release-artifacts -type f | sort)
          fi
