name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v0.2.*"]
    branches: ["release/v0.2.*-alpha.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Verify release ref and version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify release source
        id: version
        shell: bash
        run: |
          tag="v$(jq -er .version apps/fontferry/src-tauri/tauri.conf.json)"
          [[ "$tag" =~ ^v0\.2\.[0-9]+(-[a-zA-Z0-9.-]+)?$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$tag" == *-alpha.* ]]
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          else
            [[ "$tag" =~ ^v0\.2\.[0-9]+-alpha\.[0-9]+$ ]]
            test "$GITHUB_REF" = "refs/heads/release/$tag"
            main_commit=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            test "$GITHUB_SHA" = "$main_commit"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    permissions:
      contents: read
      checks: write
      issues: write
    uses: ./.github/workflows/ci.yml

  build:
    name: Bundle (${{ matrix.platform }})
    needs: quality
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            bundles: nsis
            target: x86_64-pc-windows-msvc
          - platform: macos-universal
            os: macos-15
            bundles: dmg,app
            target: universal-apple-darwin
          - platform: linux-x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: bash scripts/install-ubuntu-build-deps.sh rpm
      - name: Build signed updater artifacts and bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY in the release environment"
            exit 1
          }
          # Invoke the installed CLI directly so the separator reaches Tauri.
          node node_modules/@tauri-apps/cli/tauri.js build --config apps/fontferry/src-tauri/tauri.conf.json --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked
      - name: Index distributable bundle checksums
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          find "$bundle_dir" -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.dmg' -o -name '*.tar.gz' -o -name '*.exe' -o \
            -name '*.zip' -o -name '*.sig' \
          \) -print0 | sort -z | xargs -0 sha256sum > bundle-checksums.txt
          test -s bundle-checksums.txt
      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: bundle-checksums.txt
      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate workspace SBOM
        run: cargo cyclonedx --format json --all
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  windows-smoke:
    name: Windows installer smoke test
    needs: [prepare, build]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: windows-bundle
      - name: Test the signed installer on Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/windows-installer-smoke.ps1 -BundlePath windows-bundle -Version ($env:RELEASE_TAG.Substring(1))
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "24"
      - name: Test real font installation and retry as a standard Windows user
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/windows-product-acceptance.ps1 -BundlePath windows-bundle -Version ($env:RELEASE_TAG.Substring(1))

      - name: Upgrade the previous release with a managed Windows font
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/windows-product-acceptance.ps1 -BundlePath windows-bundle -Version ($env:RELEASE_TAG.Substring(1)) -VerifyUpgrade

  publish:
    name: Verify bundles and publish GitHub release
    needs: [prepare, build, sbom, windows-smoke]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Download bundles and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Generate SHA-256 checksums
        run: |
          find release-artifacts -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*setup.exe' -o \
            -name '*.sig' -o -name '*.cdx.json' \
          \) -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS
      - name: Generate Tauri updater manifest
        run: |
          node scripts/updater-manifest.mjs release-artifacts "$GITHUB_REPOSITORY" "$RELEASE_TAG"
          sha256sum release-artifacts/latest.json >> release-artifacts/SHA256SUMS
      - name: Verify updater payload signatures
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          jq -er .plugins.updater.pubkey apps/fontferry/src-tauri/tauri.conf.json \
            | base64 --decode > "$RUNNER_TEMP/fontferry-updater.pub"
          while IFS= read -r -d '' signature; do
            base64 --decode "$signature" > "$RUNNER_TEMP/fontferry-updater.sig"
            minisign -Vm "${signature%.sig}" -p "$RUNNER_TEMP/fontferry-updater.pub" \
              -x "$RUNNER_TEMP/fontferry-updater.sig"
          done < <(find release-artifacts -type f \( \
            -name '*setup.exe.sig' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage.sig' \
          \) -print0)
      - name: Create release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          prerelease=()
          if [[ "$tag" == *-* ]]; then prerelease=(--prerelease); fi
          target=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then target=(--verify-tag); fi
          gh release create "$tag" --draft "${target[@]}" --generate-notes "${prerelease[@]}"
          mapfile -d '' artifacts < <(
            find release-artifacts -type f \( \
              -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
              -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*setup.exe' -o \
              -name '*.sig' -o -name '*.cdx.json' \
            \) -print0
          )
          artifacts+=(release-artifacts/latest.json release-artifacts/SHA256SUMS)
          gh release upload "$tag" "${artifacts[@]}"
          gh release edit "$tag" --draft=false
          if [[ "$tag" == *-alpha* || "$tag" == *-beta* ]]; then
            gh release view beta >/dev/null 2>&1 || \
              gh release create beta --target "$GITHUB_SHA" --prerelease --title "FontFerry beta channel"
            gh release upload beta "${artifacts[@]}" --clobber
          fi
