[workspace]
resolver = "3"
members = [
  "crates/fontferry-core",
  "crates/fontferry-platform",
  "apps/fontferry/src-tauri",
  "xtask",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
authors = ["teckc"]
license = "Apache-2.0"
repository = "https://github.com/teckc/fontferry"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
fontferry-core = { path = "crates/fontferry-core" }
fontferry-platform = { path = "crates/fontferry-platform" }
futures-util = "0.3"
flate2 = "1"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = "0.6"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ttf-parser = "0.25"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
