[advisories]
unmaintained = "all"
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "Tauri opener/single-instance retain zbus5; unmaintained only; expires 2026-12-15; scripts/maintenance-exceptions.mjs enforces scope/date/type" },
  { id = "RUSTSEC-2026-0371", reason = "Tauri opener/single-instance retain zbus5; unmaintained only; expires 2026-12-15; scripts/maintenance-exceptions.mjs enforces scope/date/type" },
  { id = "RUSTSEC-2026-0372", reason = "Tauri opener/single-instance retain zbus5; unmaintained only; expires 2026-12-15; scripts/maintenance-exceptions.mjs enforces scope/date/type" },
  # Tauri 2 Linux currently depends on GTK3 bindings. These advisories are
  # unmaintained notices, not known vulnerabilities; remove when Tauri moves.
  "RUSTSEC-2024-0370",
  # Transitive proc-macro/Unicode and direct ttf-parser maintenance notices.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
